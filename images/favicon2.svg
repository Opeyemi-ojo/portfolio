<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9f"></stop>
      <stop offset="100%" stop-color="#00f5ff"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#020617"></rect>

  <!-- Neon O -->
  <circle cx="32" cy="32" r="16" stroke="url(#grad)" stroke-width="4" fill="#00ff9f" fill-opacity="0.12" filter="url(#glow)"></circle>

  <!-- Code slash -->
  <line x1="26" y1="40" x2="38" y2="24" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"></line>
</svg>